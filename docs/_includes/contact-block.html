{% comment %}
  Closing contact block with photo, green phone button and e-mail address, the same block as on the homepage.
  Parameters: heading and lead (both may contain HTML).
{% endcomment %}
<section id="contact" class="section-mb" aria-labelledby="contact-heading">
  <div class="section-grid items-center gap-y-15">
    <div class="col-span-12 md:col-span-8 md:col-start-5 lg:col-span-6 lg:col-start-5">
      <h2 id="contact-heading" class="section-heading">{{ include.heading }}</h2>
      <p class="mb-8 section-lead">{{ include.lead }}</p>
      <div class="flex flex-wrap items-center gap-6">
        <a
          href="tel:+31246757990"
          class="inline-flex items-center gap-2 rounded-full bg-green-700 px-6 py-3 text-base font-medium text-white hover:bg-green-800 hover:text-white">
          <svg viewBox="0 0 24 24" fill="currentColor" class="-ml-0.5 size-5" aria-hidden="true" focusable="false">
            <path
              fill-rule="evenodd"
              d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z"
              clip-rule="evenodd"></path>
          </svg>
          024 - 675 79 90
        </a>
        <a href="mailto:info@flinksoftware.com" class="inline-flex items-center gap-x-2 text-base font-medium">
          <svg
            class="-ml-0.5 size-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
            focusable="false">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75"></path>
          </svg>
          info@flinksoftware.com
        </a>
      </div>
    </div>
    <div class="col-span-6 md:order-first md:col-span-3 md:col-start-1 lg:col-start-2">
      <img
        class="aspect-[4/5] w-52 flex-none rounded-2xl object-cover"
        src="/img/tonny-garic.webp"
        alt="Tonny Garić"
        loading="lazy"
        decoding="async"
        width="208"
        height="260" />
      <div class="mt-3 ml-3">
        <p class="text-base leading-[1.4] 2xl:text-xl">
          <span class="font-medium">Tonny Garić</span>
          <br />
          Co-Founder
        </p>
      </div>
    </div>
  </div>
</section>
